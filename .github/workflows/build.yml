name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: |
          cat gradlew | head -20
          echo "---"
          echo "Testing: sh -x gradlew clean"
          sh -x gradlew clean 2>&1 | head -40

      - name: Assemble APK
        run: |
          echo "Testing direct java call:"
          java -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain --version 2>&1
          echo "=== assembleDebug ==="
          java -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain assembleDebug 2>&1 | tail -30
        run: |
          echo "=== 查找所有 APK 文件 ==="
          find . -name "*.apk" -type f 2>/dev/null
          echo "---"
          echo "APK路径:"
          find . -name "*.apk" -type f 2>/dev/null

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: income-meter-debug-apk
          path: app/build/outputs/apk/debug/
          retention-days: 30
