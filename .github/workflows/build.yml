name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: |
          echo "=== gradlew 文件行尾检查 ==="
          file gradlew
          head -1 gradlew | cat -A
          echo "=== gradlew 前 30 行内容 ==="
          head -30 gradlew | cat -A
          echo "=== 直接用 bash 运行 gradlew tasks ==="
          bash gradlew tasks --no-daemon 2>&1 | head -30
          echo "=== 执行 assembleDebug ==="
          bash gradlew assembleDebug --info --stacktrace --no-daemon 2>&1 | tail -50

      - name: Find APK files
        run: |
          echo "=== 查找所有 APK 文件 ==="
          find . -name "*.apk" -type f 2>/dev/null
          echo "---"
          echo "APK路径:"
          find . -name "*.apk" -type f 2>/dev/null

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: income-meter-debug-apk
          path: app/build/outputs/apk/debug/
          retention-days: 30
