# Gitee Go 流水线配置 - Android APK 构建
# Gitee Go 文档: https://gitee.com/help/articles/4293

gitee_cicd_config:
  enable_remote_build: true

stages:
  - build

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx2048m"

android_build:
  stage: build
  script:
    # 切换到项目目录
    - cd /repo

    # 设置 gradlew 可执行
    - chmod +x gradlew

    # 构建 APK（跳过 daemon，限制内存）
    - ./gradlew assembleDebug --no-daemon --stacktrace
  artifacts:
    name: income-meter-apk
    paths:
      - app/build/outputs/apk/debug/app-debug.apk
    expire_in: 7 days
  only:
    - master
    - main
